name: ResearchOS Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # GitHub cron is UTC. This daily rebuild keeps "today" and the
    # activity calendar fresh even when there is no source commit.
    - cron: "15 0 * * *"

permissions:
  contents: write

concurrency:
  group: researchos-publish
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    env:
      RESEARCHOS_TZ: "Asia/Shanghai"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ResearchOS Python dependency
        run: python -m pip install pyyaml

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Publish ResearchOS
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
