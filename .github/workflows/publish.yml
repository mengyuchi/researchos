name: ResearchOS Publish

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    # GitHub cron uses UTC.
    - cron: "15 0 * * *"

permissions:
  contents: write

concurrency:
  group: researchos-publish
  cancel-in-progress: true

jobs:
  build-deploy:

    runs-on: ubuntu-latest

    env:
      RESEARCHOS_TZ: "Asia/Shanghai"

    steps:

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ResearchOS Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Check environment
        run: |
          python --version
          quarto --version
          python -c "import yaml; print('PyYAML OK:', yaml.__version__)"

      - name: Make ResearchOS scripts executable
        run: |
          chmod +x scripts/check.sh
          chmod +x scripts/preview.sh
          chmod +x scripts/sync-public.sh

      - name: Run ResearchOS checks
        run: |
          ./scripts/check.sh

      - name: Publish ResearchOS
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}