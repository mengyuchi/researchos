name: ResearchOS Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # GitHub cron is UTC.
    - cron: "15 0 * * *"

permissions:
  contents: write

concurrency:
  group: researchos-publish
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    env:
      RESEARCHOS_TZ: "Asia/Shanghai"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ResearchOS Python dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Run ResearchOS checks
        run: |
          chmod +x scripts/check.sh
          ./scripts/check.sh

      - name: Publish ResearchOS
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}