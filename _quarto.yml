project:
  type: website
  output-dir: _site

execute:
  freeze: auto

website:
  title: "ResearchOS"
  site-url: "https://mengyuchi.github.io/researchos/"

  search: true
  page-navigation: true

  repo-url: "https://github.com/mengyuchi/researchos"
  repo-branch: main
  repo-actions:
    - edit
    - source
    - issue
  repo-link-target: "_blank"

  navbar:
    pinned: true
    left:
      # ResearchOS dashboard
      - href: index.qmd
        text: Dashboard

      # Obsidian-backed ResearchOS 2.0 sections
      - href: knowledge/projects.qmd
        text: Projects

      # Legacy manuscript pipeline retained during migration
      - href: papers/index.qmd
        text: Papers

      - href: knowledge/ideas.qmd
        text: Ideas

      - href: knowledge/literature.qmd
        text: Literature

      - href: knowledge/experiments.qmd
        text: Experiments

      # Legacy dataset section retained during migration
      - href: datasets/index.qmd
        text: Datasets

      - href: knowledge/methods.qmd
        text: Methods

      - href: knowledge/publications.qmd
        text: Publications

      # Legacy public research log retained during migration
      - href: logs/index.qmd
        text: Log

      - href: about.qmd
        text: About

    right:
      - icon: github
        href: "https://github.com/mengyuchi/researchos"
        aria-label: "ResearchOS on GitHub"

  page-footer:
    left: "ResearchOS · Academic Research Operating System"
    right:
      - text: "GitHub"
        href: "https://github.com/mengyuchi/researchos"

format:
  html:
    theme:
      light:
        - flatly
        - assets/scss/researchos.scss
      dark:
        - darkly
        - assets/scss/researchos.scss
        - assets/scss/researchos-dark.scss
    respect-user-color-scheme: true
    toc: true
    code-copy: true
    code-fold: true
    anchor-sections: true

editor: visual